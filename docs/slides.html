<!doctype html>
<html>

<head>
    <title>Slides Test Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .slide {
            border: 2px solid red;
            min-height: 320px;
            position: relative;
        }
        h1 {
            border: 2px solid orange;
        }
        h2 {
            border: 2px solid green;
        }
        p {
            border: 2px solid blue;
            margin-right: 1rem;
            margin-left: 1rem;
        }
        .slide h2 {
            border: 2px solid purple;
            padding: 1rem;
            text-align: center;
        }
        .slide-header-red
        {
            background-color: #EBC3C4;
        }
        .slide-header-green
        {
            background-color: #DFE9BE;
        }
        .slide-header-blue{
            background-color: #D0E4E8;
        }
        .slide-learn-more {
            /* text-align: right;
            vertical-align: bottom; */
            padding-right: 1rem;
            border: 2px solid grey;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-sm" style="background-color: #FFFCE9;" data-bs-theme="light">

        <!-- Navbar content -->
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Navbar Brand</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#slide-1">First</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#slide-2">Second</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#slide-3">Third</a>
                    </li>
                </ul>

            </div>

        </div>

    </nav>

    <header> </header>

    <main>
        <h1>Slides Demo Page</h1>

        <section id="slide-1">
            <div class="slide">
                <h2 class="slide-header-red"> Research Area One </h2>
                <p> Information about Research Area One. </p>
                <div class="slide-learn-more"> <a>Learn more</a></div>
            </div>
        </section>

        <section id="slide-2">
            <div class="slide">
                <h2 class="slide-header-green"> Research Area Two </h2>
                <p> Information about Research Area Two. </p>
            </div>
        </section>

        <section id="slide-3">
            <div class="slide">
                <h2 class="slide-header-blue"> Research Area Three </h2>
                <p> Information about Research Area Three. </p>
            </div>
        </section>
        
    </main>

    <footer> </footer>

</body>

</html>
