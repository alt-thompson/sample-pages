{% assign recent_projects = include.values | reverse %}

<div class="container-fluid mt-5">
    <h3 class="section-header text-center p-2">{{ include.header }}</h3>
    <div class="row">

        {% for value in recent_projects limit:include.limit %}
        <div class="col-lg-3 d-flex justify-content-center">
            {% include project-card.html project=value %}
            
        </div>
        {% endfor %}
    </div>
    <div class="row">
        <div class="col-lg-12 py-2 px-5 d-flex justify-content-end">
            <a href="{{ "/projects.html" | relative_url }}">See All Projects ></a>
        </div>
      </div>
</div>
