<div class="card p-1 m-1" style="width: 22rem;">
    <img class="card-img-top img-fluid" src="{{ '/assets/img/purple.jpg' | relative_url }}"  alt="A purple square.">
    <div class="card-body">
        <h5 class="card-title">{{ include.project.name }}</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">{{ include.project.timeline }}</h6>
        <a href="{{ include.project.url | relative_url }}" class="card-link">Learn more</a>
      </div>
</div>
